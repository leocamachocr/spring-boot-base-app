name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (unit + ArchUnit + Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload test and Checkstyle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/

  e2e:
    name: E2E (Cucumber)
    needs: build
    runs-on: ubuntu-latest
    env:
      # application.yaml points to a Windows file DB; use a fresh in-memory H2 in CI.
      SPRING_DATASOURCE_URL: jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - uses: gradle/actions/setup-gradle@v4

      - name: Start application
        run: |
          ./gradlew bootRun > bootrun.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:8080/api/public/login; then
              echo "App is up"
              exit 0
            fi
            sleep 3
          done
          echo "App did not start in time"
          cat bootrun.log
          exit 1

      - name: Run E2E tests
        run: ./gradlew e2eTest

      - name: Upload Cucumber report and app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            build/reports/cucumber/
            build/reports/tests/e2eTest/
            bootrun.log
