spring:
  application:
    name: client-service
  config:
    # Optional local secrets (git-ignored), read as KEY=value properties. See .env.example.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:file:C:/data/testdb123
    username: user
    password: password
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
jwt:
  secret: KXiUPknkoVDCHdNrrYnxmA5oQLbv+LE7eHG8vkk71fjEPq0lmlZKwBhUVLUqKSmGam8P4kWxXKTGCDRgpZ5BMA==
features:
  chatbot:
    # FEATURES_CHATBOT_ENABLED (environment or .env). When false, no chatbot bean is created and no key is needed.
    enabled: ${FEATURES_CHATBOT_ENABLED:false}
google:
  ai:
    api-key: ${GOOGLE_AI_API_KEY:}
    model: gemini-flash-latest
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout: 30s
chatbot:
  history-max-turns: 20
